<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🐶 Pablo's Patisserie</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="app">

        <header>

            <h1>🐶 Pablo's Patisserie</h1>

            

        </header>

        <section class="display-case">

            <h2>🍰 Today's Display Case</h2>

            <div class="cakes">

                <div class="cake">🍰</div>
                <div class="cake">🍪</div>
                <div class="cake">🧁</div>
                <div class="cake">🥖</div>
                <div class="cake">🥐</div>

                <div class="cake">🍩</div>
                <div class="cake">🎂</div>
                <div class="cake">🥧</div>
                <div class="cake">🍞</div>
                <div class="cake">🥨</div>

            </div>

            <p class="timer">
                ✨ Changes Daily ✨
            </p>

        </section>

        <section class="menu">

            <button id="playButton">
                ▶ Play
            </button>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
