<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🐶 Pablo's Patisserie</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <header>

        <img
            src="images/pablo.png"
            alt="Pablo"
            id="pablo">

        <h1>Pablo's Patisserie</h1>

    </header>

    <main>

        <section class="display">

            <h2>Today's Display</h2>

            <div class="displayShelf">

                <img src="images/cookie.png" class="food" alt="Cookie">

                <img src="images/cupcake.png" class="food" alt="Cupcake">

                <img src="images/croissant.png" class="food" alt="Croissant">

                <img src="images/cake.png" class="food" alt="Cake">

                <img src="images/pie.png" class="food" alt="Pie">

                <img src="images/bread.png" class="food" alt="Bread">

                <img src="images/pretzel.png" class="food" alt="Pretzel">

                <img src="images/doughnut.png" class="food" alt="Doughnut">

                <img src="images/baguette.png" class="food" alt="Baguette">

                <img src="images/birthdaycake.png" class="food" alt="Birthday Cake">

            </div>

            <p class="daily">
                ✨ Changes Daily ✨
            </p>

        </section>

        <button id="playButton">

            Start Baking

        </button>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>
