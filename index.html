<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"

    <title>Pablo's Patisserie</title>

        html,

            min-height: 100%;
        }

        strong,
        b {
            font-family: "Cedarville Cursive", cursive;
            color: #a06f45;
        }

        h1 {
            font-size: 3rem;
        }

        a {
            color: #c49a24 !important;

            width: 140px;
            height: 140px;

            background: #f6d77a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 60px;

            font-size: 25px;

            margin: 5px;

            color: #c49a24;

        }

</head>


<body>

<div id="app">

    <!-- =========================
         HOME
         ========================= -->

    <section id="homeScreen">

        <header>

            <img
                src="images/pablo.png"
                alt="Pablo"
                id="pablo"
            >

            <h1>
                Pablo's Patisserie
            </h1>

        </header>


        <main>

            <h2>
                Today's Bake
            </h2>

            <p>
                Draw a
                <strong id="recipeName">
                    Loading...
                </strong>
            </p>


            <button id="playButton">
                🍰 Play
            </button>


            <button
                onclick="
                    document.getElementById('homeScreen').style.display='none';
                    document.getElementById('badgesScreen').style.display='block';
                    renderBadges();
                "
            >
                🏆 Badges
            </button>

                </h2>

                    Loading...
                </div>

            </section>

        </main>

    </section>


    <!-- =========================
         BADGES SCREEN
         ========================= -->

    <section
        id="badgesScreen"
        style="display:none;"
    >

        <h2>
            🏆 My Badges
        </h2>

        <p id="badgeSummary">
            0 of 6 badges unlocked
        </p>


        <div id="badgeGrid"></div>


        <button
            onclick="
                document.getElementById('badgesScreen').style.display='none';
                document.getElementById('homeScreen').style.display='block';
            "
        >
            ← Back
        </button>

    </section>

</div>


<!-- =========================
     BADGE SYSTEM
     ========================= -->

<script>

const badgeList = [

    {
        id: "wrongBake",
        name: "Wrong Bake",
        requirement: "Make your first wrong bake.",
        image: "badges/wrong-bake.png"
    },

    {
        id: "firstBake",
        name: "First Bake",
        requirement: "Complete your first correct bake.",
        image: "badges/first-bake.png"
    },

    {
        id: "amateurBaker",
        name: "Amateur Baker",
        requirement: "Complete 2 correct bakes.",
        image: "badges/amateur-baker.png"
    },

    {
        id: "pablosHelper",
        name: "Pablo's Helper",
        requirement: "Complete 3 correct bakes in a row.",
        image: "badges/pablos-helper.png"
    },

    {
        id: "skilledBaker",
        name: "Skilled Baker",
        requirement: "Complete 5 correct bakes.",
        image: "badges/skilled-baker.png"
    },

    {
        id: "patisseriePro",
        name: "Patisserie Pro",
        requirement: "Complete 10 correct bakes.",
        image: "badges/patisserie-pro.png"
    }

];


function getSavedBadges() {

    const saved =
        localStorage.getItem("pablosBadgeProgress");

    if (!saved) {

        return {
            wrongBake: false,
            firstBake: false,
            amateurBaker: false,
            pablosHelper: false,
            skilledBaker: false,
            patisseriePro: false
        };

    }

    try {

        return JSON.parse(saved);

    } catch {

        return {};

    }

}


function renderBadges() {

    const grid =
        document.getElementById("badgeGrid");

    const summary =
        document.getElementById("badgeSummary");

    const progress =
        getSavedBadges();


    grid.innerHTML = "";


    let unlocked = 0;


    badgeList.forEach((badge) => {

        const isUnlocked =
            progress[badge.id] === true;


        if (isUnlocked) {
            unlocked++;
        }


        const card =
            document.createElement("div");

        card.className =
            isUnlocked
                ? "badge-card"
                : "badge-card locked";


        const image =
            document.createElement("img");

        image.className =
            "badge-image";

        image.src =
            badge.image;

        image.alt =
            badge.name;


        image.onerror = function() {

            this.style.display = "none";


            const placeholder =
                document.createElement("div");

            placeholder.className =
                "badge-placeholder";

            placeholder.textContent =
                isUnlocked ? "🏆" : "🔒";


            card.insertBefore(
                placeholder,
                card.firstChild
            );

        };


        const title =
            document.createElement("h3");

        title.textContent =
            badge.name;


        const requirement =
            document.createElement("p");

        requirement.textContent =
            badge.requirement;


        const status =
            document.createElement("div");

        status.className =
            "badge-status";

        status.textContent =
            isUnlocked
                ? "✓ Unlocked!"
                : "🔒 Locked";


        card.appendChild(image);
        card.appendChild(title);
        card.appendChild(requirement);
        card.appendChild(status);


        grid.appendChild(card);

    });


    summary.textContent =
        `${unlocked} of 6 badges unlocked`;

}

</script>
